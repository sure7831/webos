<!DOCTYPE html>

<html>

 <script defer>
    function updateClock() {
        var time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        var timetext = document.querySelector("#time");
        if (timetext) {
            timetext.textContent = "time: " + time;
        }
    }
   
    updateClock();
    
    setInterval(updateClock, 1000);
</script>

<div style="display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; left: 0; width: 100vw; background-color: rgba(71, 116, 136, 0.9); border-bottom: 2px solid rgb(0, 255, 255); box-sizing: border-box; padding: 6px 0; height: 35px; z-index: 999;">
    <p id="welcomeopen" class="window-launcher" style="margin: 0 0 0 20px; color: white; font-family: 'Electrolize', sans-serif; font-size: 0.95rem; font-weight: bold; letter-spacing: 1px;">
        webos
    </p>
    <p id="time" style="margin: 0 20px 0 0; color: white; font-family: 'Electrolize', sans-serif; font-size: 0.95rem;">
        time: Loading...
    </p>
</div>
